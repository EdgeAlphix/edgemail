name: EdgeMail upstream update

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edgemail-upstream-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Merge upstream while preserving EdgeMail changes
        run: |
          set -euo pipefail
          git config user.name "edgemail-update"
          git config user.email "edgemail-update@users.noreply.github.com"
          git remote add upstream https://github.com/hieunc229/mailflare.git
          git fetch --no-tags upstream main
          git merge --no-edit upstream/main
      - run: npm ci --no-audit --no-fund
      - run: node --test --test-concurrency=2 tests/*.test.mjs
      - run: npm run build
      - name: Publish verified update
        run: git push origin "HEAD:${GITHUB_REF_NAME}"
